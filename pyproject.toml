[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperget"
version = "0.1.0"
description = "A DOI and title based research paper downloader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
paperget = "paperget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
