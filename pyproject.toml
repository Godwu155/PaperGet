[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperget"
version = "0.3.0.dev3"
description = "A DOI and title based research paper downloader"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
gui = ["PySide6-Essentials==6.12.0", "keyring>=25,<27"]

[project.scripts]
paperget = "paperget.cli:main"
paperget-gui = "paperget.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperget = ["assets/*.ico"]
